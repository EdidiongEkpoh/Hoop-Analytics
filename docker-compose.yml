x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: hoop-analytics-airflow:latest
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@hoop-analytics-metadata-db/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    # Credentials for the NBA warehouse DB
    NBA_DB_HOST: ${NBA_DB_HOST}
    NBA_DB_PORT: ${NBA_DB_PORT}
    NBA_DB_NAME: ${NBA_DB_NAME}
    NBA_DB_USER: ${NBA_DB_USER}
    NBA_DB_PASSWORD: ${NBA_DB_PASSWORD}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./extract:/opt/airflow/extract
    - ./dbt:/opt/airflow/dbt
    - airflow-logs:/opt/airflow/logs
  depends_on:
    hoop-analytics-metadata-db:
      condition: service_healthy

services:
  # --- Warehouse database ---
  hoop-analytics-warehouse-db:
    image: postgres:16
    container_name: hoop-analytics-warehouse-db
    environment: 
      POSTGRES_USER: ${NBA_DB_USER}
      POSTGRES_PASSWORD: ${NBA_DB_PASSWORD}
      POSTGRES_DB: ${NBA_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - hoop-analytics-warehouse-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nba"]
      interval: 5s
      timeout: 5s
      retries: 10

# --- Airflow's metadata database ---
  hoop-analytics-metadata-db:
    image: postgres:16
    container_name: hoop-analytics-metadata-db
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - hoop-analytics-metadata-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init: 
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
        --username ${AIRFLOW_ADMIN_USER} --password ${AIRFLOW_ADMIN_PASSWORD} \
        --firstname ${AIRFLOW_ADMIN_FIRSTNAME} --lastname ${AIRFLOW_ADMIN_LASTNAME} \
        --role Admin --email ${AIRFLOW_ADMIN_EMAIL}

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports: 
      - "127.0.0.1:8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
  
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler 
    depends_on:
      airflow-init: 
        condition: service_completed_successfully

volumes:
  hoop-analytics-warehouse-data:
  hoop-analytics-metadata-data:
  airflow-logs: