version: 2

models:
  - name: dim_teams
    description: Team identity fields and season standings.
    columns:
      - name: team_id
        tests:
          - not_null
          - unique
      - name: full_name
        description: Team's city and nickname.
      - name: conference
      - name: division
      - name: wins
      - name: losses
      - name: win_pct
  
  - name: dim_players
    description: Player bio information and most recent team.
    columns:
      - name: player_id
        tests:
          - not_null
          - unique
      - name: current_team_id
        description: Player's most recent team, if any.
  
  - name: fct_team_games
    description: Team boxscores, including opponent's stats.
    columns:
      - name: game_id
        tests:
          - not_null
      - name: team_id
        tests: 
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - game_id
              - team_id

  - name: fct_player_games
    description: Player boxscores.
    columns:
      - name: game_id
        tests:
          - not_null
      - name: player_id
        tests: 
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - game_id
              - player_id 
  
  - name: fct_team_season_summary
    description: Raw season averages for each team.
    columns:
      - name: team_id
        tests: 
          - not_null
      - name: pts_per_game
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - team_id
              - season
              - league_id
              - season_type
  
  - name: fct_player_season_summary
    description: Raw season averages for each player.
    columns:
      - name: player_id
        description: Player's unique identifier, duplicates are created for players who played on multiple teams during the season.

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_id
              - team_id
              - season
              - league_id
              - season_type
  
  - name: fct_player_tracking_stats
    description: Raw total Catch-and-shoot, pull-up, drives, post-ups, and other player tracking stats for each player.
    columns:
      - name: player_id
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_id
              - team_id
              - season
              - league_id
              - season_type
  
  - name: fct_player_tracking_stats_per_game
    description: Per game Catch-and-shoot, pull-up, drives, post-ups, and other player tracking stats for each player.
    columns:
      - name: player_id
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - player_id
              - team_id
              - season
              - league_id
              - season_type
  
  - name: fct_player_stats_per_36
