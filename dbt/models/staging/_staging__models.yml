      - name: catch_shoot_fga
        description: Total catch and shoot field goal attempts.
      - name: catch_shoot_fg_pct
        description: Catch and shoot field goal percentage.
      - name: catch_shoot_fg3m
        description: Total catch and shoot three point makes.
      - name: catch_shoot_fg3a
        description: Total catch and shoot three point attempts.
      - name: catch_shoot_fg3_pct
        description: Catch and shoot three point percentage.
      - name: catch_shoot_efg
        description: Catch and shoot effective field goal percentage.
      - name: catch_shoot_pts
        description: Total points scored on catch and shoot attempts.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season
              - league_id
              - player_id
              - season_type
  
  - name: stg_player_drives_stats
    description: Player drives stats.
    columns:
      - name: season
        description: CLI-driven season string for this extract run (e.g. "2025-26").
      - name: league_id
        description: League ID for this extract run (e.g. "00" for NBA).
      - name: season_type
        description: Season type for this extract run ("Regular Season" or "Playoffs").
      - name: player_id
        description: ID of the player.
        tests:
