        description: Team's total wins in the season.
      - name: losses
        description: Team's total losses in the season.
      - name: win_pct
        description: Win percentage (wins / games played).
      - name: league_rank
        description: Team's overall rank in the league by winning percentage
      - name: conference_games_back
        description: Number of games back from conference's first seed.
      - name: division_games_back
        description: Number of games back from the division lead.
      - name: clinch_indicator
        description: Text flag for clinched playoff/division/conference status, if applicable.
      - name: home_record
        description: Home win-loss record (e.g. "15-8").
      - name: road_record
        description: Road win-loss record (e.g "12-9").
      - name: last_10_record
        description: Team's record in the last 10 games (e.g. "7-3").
      - name: ot_record
        description: Team's record in games that go to overtime (e.g. "7-3").
      - name: current_streak
        description: Team's current win or loss streak (e.g "W3" or "L2").
      - name: long_win_streak
        description: Team's longest winning streak of the season.
      - name: long_loss_streak
        description: Team's longest losing streak of the season.
      - name: points_per_game
