      - name: fta
        description: The amount of free throws the team attempted in the game.
      - name: ft_pct 
        description: The percentage of free throws the team made vs attempted in the game.
      - name: oreb
        description: The amount of offensive rebounds the team accumulated in the game.
      - name: dreb
        description: The amount of defensive rebounds the team accumulated in the game.
      - name: reb
        description: The total number of rebounds the team accumulated in the game.
      - name: ast
