      - name: season_type
        description: Season type for this extract run ("Regular Season" or "Playoffs").
      - name: shot_zone_basic
        description: Broad court zone.
      - name: shot_zone_area
        description: Left/right/center court area.
      - name: shot_zone_range
        description: Distance bucket.
      - name: fga 
        description: League-wide total field goal attempts from the zone.
      - name: fgm
        description: League-wide total field goal makes from the zone.
      - name: fg_pct
        description: League-wide field goal percentage from this zone.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season
              - season_type
              - league_id
              - shot_zone_basic
              - shot_zone_area
              - shot_zone_range
    
  - name: stg_player_catch_shoot_stats
