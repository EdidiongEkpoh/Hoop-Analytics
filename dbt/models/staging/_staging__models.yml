            combination_of_columns:
              - season_id_code
              - team_id
  
  - name: stg_shot_chart_detail
    description: Details on all shots.
    columns:
      - name: season
        description: CLI-driven season string for this extract run (e.g. "2025-26").
      - name: league_id
        description: League ID for this extract run (e.g. "00" for NBA).
      - name: season_type
        description: Season type for this extract run ("Regular Season" or "Playoffs").
      - name: game_id
        description: ID of the game the shot occured in.
        tests:
          - not_null
      - name: game_event_id
        description: Sequential event ID, unique per shot event for a given player/game.
        tests:
          - not_null
      - name: player_id
        description: ID of the player who took the shot.
        tests:
          - not_null 
      - name: player_name
        description: Name of the player who took the shot.
      - name: team_id
        description: ID of the shooting player's team.
      - name: team_name
        description: Name of the shooting player's team.
      - name: quarter
        description: Quarter the shot was taken in (5+ indicates overtime).
      - name: minutes_remaining
        description: Minutes remaining in the period when the shot was taken.
      - name: seconds_remaining
        description: Seconds remaining in the period when the shot was taken.
      - name: event_type
        description: Event outcome, "Made Shot" or "Missed Shot".
      - name: action_type
        description: Type of shot (e.g. "Jump Shot", "Layup", "Dunk")
      - name: shot_type
        description: '"2 PT Field Goal" or "3PT Field Goal"'
      - name: shot_zone_basic
        description: Broad court zone (e.g. "Restricted Area", "Mid-Range", "Above the Break 3").
      - name: shot_zone_area
        description: Left/right/center court area (e.g. "Left Side(L)", "Center(C)")
      - name: shot_zone_range
        description: Distance bucket (e.g. "Less than 8 ft.", "24+ ft.")
      - name: shot_distance
        description: Shot distance from the basket, in feet.
      - name: loc_x
        description: Shot X-coordinate on the court grid.
      - name: loc_y
        description: Shot Y-coordinate on the court grid.
      - name: shot_attempted_flag
        description: 1 for every row (all rows are attempts); kept for compatibility with raw API's shape.
      - name: shot_made_flag
        description: 1 if the shot was made, 0 if missed.
        tests:
          - accepted_values:
              values: [0, 1]
      - name: game_date
        description: Date the game was played.
    tests: 
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - game_id 
              - player_id
              - game_event_id
              - league_id
  

  - name: stg_shot_zone_league_averages
