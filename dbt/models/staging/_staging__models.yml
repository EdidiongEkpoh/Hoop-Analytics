      - name: team_abbreviation
        description: Abbreviation of the team the player is on.
      - name: minutes
        description: Total minutes played.
      - name: drive_fgm 
        description: Total drives field goal makes.
      - name: drive_fga
        description: Total drives field goal attempts.
      - name: drive_fg_pct
        description: Drives field goal percentage.
      - name: drive_ftm
        description: Total free throws made from drives attempts.
      - name: drive_fta
        description: Total free throws attempted from drives attempts.
      - name: drive_ft_pct
        description: Drives free throw percentage.
      - name: drive_pts
        description: Total points scored on drives attempts.
      - name: drive_ast
        description: Total assists on drives attempts.
      - name: drive_tov
        description: Total turnovers on drives attempts.
      - name: drive_pf
        description: Total personal fouls on drives attempts.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season
              - league_id
              - player_id
              - season_type
  
  - name: stg_player_postup_stats
    description: Player post-up stats.
    columns:
      - name: season
        description: CLI-driven season string for this extract run (e.g. "2025-26").
      - name: league_id
        description: League ID for this extract run (e.g. "00" for NBA).
      - name: season_type
        description: Season type for this extract run ("Regular Season" or "Playoffs").
      - name: player_id
        description: ID of the player.
        tests:
          - not_null
      - name: player_name
        description: Name of the player.
      - name: team_id
        description: ID of the team the player is on.
      - name: team_abbreviation
        description: Abbreviation of the team the player is on.
      - name: minutes
        description: Total minutes played.
      - name: touches
        description: Total number of touches.
      - name: post_touches
        description: Total number of post-up touches.
      - name: post_touch_fgm
        description: Total post-up field goal makes.
      - name: post_touch_fga
        description: Total post-up field goal attempts.
      - name: post_touch_fg_pct
        description: Post-up field goal percentage.
