version: 2

models:
  - name: stg_players
    description: All active players.
    columns: 
      - name: id
        description: ID of the player.
        tests:
          - not_null
      - name: first_name
        description: The player's first name.
      - name: last_name
        description: The player's last name.
      - name: full_name
        description: The player's full name.
      
  - name: stg_player_info
    description: Descriptive information for each player.
    columns:
      - name: season
        description: CLI-driven season string for this extract run (e.g. "2025-26").
      - name: league_id
        description: League ID for this extract run (e.g. "00" for NBA).
      - name: player_id
        description: ID of the player.
        tests:
          - not_null
      - name: first_name
        description: Player's first name.
      - name: last_name
        description: Player's last name.
      - name: full_name
        description: Player's full name.
      - name: birthdate
        description: Player's birthdate.
      - name: school
        description: Player's pre NBA school/club/academy.
      - name: country
        description: Player's birth country.
      - name: height
        description: Player's height (e.g. "6-5").
      - name: weight
        description: Player's weight in pounds.
      - name: season_exp
        description: Player's NBA experience ("R" for rookie).
      - name: jersey
        description: Player's current jersey number.
      - name: position
        description: Player's position.
      - name: team_id
        description: Player's current team ID.
      - name: team_abbreviation
        description: Abbreviation of player's team.
      - name: from_year
        description: Year of player's first NBA appearance.
      - name: draft_year
        description: Year player was drafted ("Undrafted" if undrafted).
      - name: draft_round
        description: The round the player was drafted in ("Undrafted" if undrafted).
      - name: draft_number
        description: The number pick the player was drafted at ("Undrafted" if undrafted).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - season
              - league_id
              - player_id
  - name: stg_player_basic_boxscores
    description: Game logs of basic stats for each player.
    columns: 
      - name: season_id_code
        description: nba_api season identifier.
      - name: season
        description: CLI-driven season string for this extract run (e.g. "2025-26").
      - name: league_id
        description: League ID for this extract run (e.g. "00" for NBA).
      - name: season_type
        description: Season type for this extract run ("Regular Season" or "Playoffs").
      - name: player_id
        description: ID of the player.
        tests:
          - not_null
      - name: player_name
        description: Player's full name.
      - name: team_id
        description: ID of the team that the player's on.
      - name: team_name
        description: Name of the team that the player's on.
      - name: game_id
        description: ID of the game.
        tests:
          - not_null 
      - name: game_date
        description: Date of the game.
      - name: matchup
        description: Abbreviation of the two teams playing in the game (e.g. GSW @ LAL).
      - name: wl
        description: Player's team won or loss the game.
        tests:
          - accepted_values:
              values: ['W', 'L']
      - name: minutes
        description: The number of minutes the player played in the game in integer format.
      - name: fgm
        description: The amount of field goals the player made in the game.
      - name: fga
        description: The amount of field goals the player attempted in the game.
      - name: fg_pct
        description: The percentage of field goals that the player made vs attempted in the game.
      - name: fg3m
        description: The amount of threes the player made in the game.
      - name: fg3a
        description: The amount of threes the player attempted in the game
      - name: fg3_pct
        description: The percentage of threes the player made vs attempted in the game.
      - name: ftm
        description: The amount of free throws the player made in the game.
      - name: fta
        description: The amount of free throws the player attempted in the game.
      - name: ft_pct 
        description: The percentage of free throws the player made vs attempted in the game.
      - name: oreb
        description: The amount of offensive rebounds the player accumulated in the game.
      - name: dreb
        description: The amount of defensive rebounds the player accumulated in the game.
      - name: reb
        description: The total number of rebounds the player accumulated in the game.
      - name: ast
        description: The number of assists the player accumulated in the game.
      - name: stl
        description: The number of steals the player accumulated in the game.
      - name: blk
        description: The number of blocks the player accumulated in the game.
      - name: tov
        description: The number of turnovers the player accumulated in the game.
      - name: pf
        description: The player's total personal fouls in the game.
      - name: pts
        description: The total amount of points the player scored in the game.
      - name: plus_minus
        description: The raw point differential of the player's team while they were on the court in the game.
    tests: 
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - game_id
              - player_id

  - name: stg_player_advanced_boxscores
    description: Game logs of advanced stats for each player.
    columns:
      - name: season
        description: CLI-driven season string for this extract run (e.g. "2025-26").
      - name: league_id
        description: League ID for this extract run (e.g. "00" for NBA).
      - name: season_type
        description: Season type for this extract run ("Regular Season" or "Playoffs").
      - name: game_id
        description: Id of the game the player played in.
        tests:
          - not_null
      - name: team_id
        description: Id of the team the player is on.
      - name: team_city
        description: City of the team that the player is on.
      - name: team_name
        description: Name of the team the player is on.
      - name: player_id
        description: Id of the player.
        tests:
          - not_null
      - name: first_name
        description: Player's first name.
      - name: last_name
        description: Player's last name.
      - name: comment
        description: Any injury/coaches comments that may have influenced the player's minutes/performance in the game.
      - name: minutes
        description: The amount of minutes/seconds the player played in the game (e.g. 41:45).
      - name: offensive_rating
        description: The team's offensive rating while the player was on the court in the game.
      - name: defensive_rating
        description: The team's defensive rating while the player was on the court in the game.
      - name: net_rating
        description: The team's net rating while the player was on the court in the game (offensive_rating - defensive_rating).
      - name: assist_pct
        description: The percentage of the team's field goals that the player assisted on while on the court in the game.
      - name: ast_to_tov
        description: The ratio of assists to turnovers the player had in the game.
      - name: oreb_pct
        description: Percentage of available offensive rebounds the player grabbed in the game.
      - name: dreb_pct
        description: Percentage of available defensive rebounds the player grabbed in the game.
      - name: reb_pct
        description: The percentage of available total rebounds the player grabbed in the game.
      - name: tov_pct
        description: Percentage of player's individual possessions that ended in a turnover in the game.
      - name: efg_pct
        description: Player's shooting accuracy in the game. Gives extra credit for three pointers.
      - name: ts_pct
        description: Player's total scoring efficiency in the game.
      - name: usage
        description: Player's share of team's offensive plays that finished with a shot attempt, free throw, or turnover while they were on the court.
      - name: pace
        description: Number of possessions the player was involved in per 48 minutes.
      - name: possessions
        description: Raw number of possessions the player was involved in the game.
    tests: 
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - game_id
              - player_id

  - name: stg_teams
    description: All teams.
    columns: 
      - name: id
        description: ID of the team.
        tests:
          - not_null
      - name: full_name
        description: Team's city and nickname.
      - name: abbreviation
        description: Team's abbreviation.
      - name: nickname
        description: Team's nickname
      - name: city
        description: City that the team plays in.
      - name: state
        description: State that the team plays in.
      - name: year_founded
        description: Year that the team was founded.
      
  - name: stg_team_rosters
    description: Players on the team for a given season
    columns:
      - name: team_id
        description: ID of the team.
        tests:
          - not_null
      - name: season
        description: Season that the roster was a part of.
      - name: league_id_code
        description: ID of the leaue (e.g. '00' is NBA)
      - name: season
        description: CLI-driven season string for this extract run (e.g. "2025-26").
      - name: league_id
        description: League ID for this extract run (e.g. "00" for NBA).
      - name: player_id
        description: ID of the player.
        tests:
          - not_null
      - name: player_name
        description: Player's full name.
      - name: jersey_number
        description: Player's jersey number.
      - name: height
        description: Player's height (e.g. "6-4")
      - name: weight
        description: Player's weight in pounds.
      - name: birthdate
        description: Player's date of birth (e.g. "June 30, 2003")
      - name: age
        description: Player's age for the season.
      - name: player_exp
        description: Number of year's the player has been in the NBA ('R' for rookie).
      - name: school
        description: Player's pre NBA school/academy/club
      - name: how_acquired
        description: Description of how the team originally acquired the player.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - team_id
              - player_id
              - season
              - league_id
  
